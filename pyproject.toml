[project]
name = "social-marketing-agent"
version = "0.1.0"
description = "Growth agent: SEO content, AI-answer visibility, social posts, and lead capture for small businesses"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "httpx>=0.28.1",
    # Persistence (Phase 1-3)
    "sqlalchemy[asyncio]>=2.0.52",
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "pgvector>=0.5.0",
    # HTML fetch + parse, for the crawl and seo engines (Phase 1, 4)
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
    "trafilatura>=2.2.0",
    # E.164 phone normalisation, for the NAP audit engine (Phase 4).
    # A naive string compare produces false "inconsistencies", which destroys
    # trust in the whole audit screen -- so normalisation is a real library.
    "phonenumbers>=9.0.37",
    # Model access. OpenRouter is OpenAI-compatible, so one SDK covers it; the
    # anthropic SDK is the SECOND adapter, which is what proves the router
    # abstraction rather than asserting it.
    "openai>=3.2.0",
    "anthropic>=0.122.0",
    # Queue + rate-limit token buckets shared across workers (Phase 2)
    "redis>=8.1.0",
    # The agent runtime. Chosen over a bare ReAct loop for bounded steps, a
    # human interrupt at a defined point, and per-node evaluation -- see
    # docs/ARCHITECTURE.md section 14.
    "langgraph>=1.2.11",
    # Password hashing. Argon2id, not bcrypt: it is the current OWASP first
    # choice and resists GPU cracking far better.
    "argon2-cffi>=25.1.0",
    # Multipart parsing, which FastAPI needs to accept an uploaded file at all.
    # Added with the document-upload route: the knowledge base had extractors, a
    # vector store and an agentic retrieval loop, and no way for a customer to put a
    # document into any of it.
    "python-multipart>=0.0.32",
    "cryptography>=50.0.0",
]

# Still phase-gated, added when the phase that needs them lands:
#   pypdf, python-docx  (the kb engine's pdf/docx extractors raise until then)
#   Phase 12 langfuse
# Ragas is NOT on that list any more: it is not installable against these pins, so the
# LLM-judged eval arm uses DeepEval instead. See docs/ARCHITECTURE.md section 14 and
# the docstring of evals/deepeval_arm.py for the full reasoning.

[dependency-groups]
dev = [
    "ruff>=0.16.3",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    # openai v3 is built on httpx2, NOT httpx, so respx cannot intercept it --
    # a suite that thinks it is mocking an OpenAI-SDK call is really hitting the
    # network. Hermetic tests for that surface need httpx2.MockTransport, so the
    # transitive dependency is declared explicitly rather than relied upon.
    "httpx2>=0.28.0",
    # The LLM-judged eval arm (evals/deepeval_arm.py): FaithfulnessMetric and
    # AnswerRelevancyMetric, which close the one hole the deterministic rubric names
    # -- a claim that cites a real chunk and misdescribes it in words. A DEV
    # dependency, not a runtime one: nothing the product serves imports it. The judge
    # itself goes through our own ModelRouter, so no DeepEval-side model credential
    # exists; its pytest plugin is disabled in `addopts` and its telemetry and dotenv
    # autoloading are forced off before import, because both would reach outside a
    # suite that promises never to.
    "deepeval>=4.1.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
# Markdown is excluded so a code sample in a doc can never fail CI formatting.
extend-exclude = ["frontend", "**/*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S", "A"]
# Alembic generates these files in its own style. Linting machine-generated code
# means hand-editing every autogenerate output forever, for no benefit -- the
# hand-written parts (RLS policies, data fixes) are still reviewed in the diff.
"backend/app/db/migrations/versions/*" = ["E501", "UP035", "UP007", "I001"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
exclude = ["frontend"]

# `evals/ragas_runner.py` is the one module in this repo that does NOT run under this
# interpreter. It executes inside `.venv-ragas`, whose whole reason to exist is that
# `ragas` caps `openai<3.0.0` while we pin `openai>=3.2.0` (see `ARCHITECTURE.md` §14),
# so `ragas` and `langchain_*` are correctly absent HERE and mypy cannot resolve them.
#
# `ignore_missing_imports`, NOT `ignore_errors`: everything the module writes itself is
# still type-checked strictly, and only the unresolvable third-party imports are waived.
# Silencing the whole file would let a genuine mistake in the one script we cannot
# import-test go unnoticed.
[[tool.mypy.overrides]]
module = ["evals.ragas_runner"]
ignore_missing_imports = true

# The absent packages themselves, named explicitly. `ignore_missing_imports` on the
# importing module is not enough: mypy resolves by TARGET module, so the waiver has to
# name what cannot be found rather than who is looking for it.
[[tool.mypy.overrides]]
module = ["ragas.*", "ragas", "langchain_openai.*", "langchain_openai", "langchain_core.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
# `-p no:deepeval` disables DeepEval's auto-registered pytest plugin. It loads in
# EVERY session simply because deepeval is installed -- before conftest.py runs, so
# before the credential strip -- and it opens a telemetry scope at session start and
# closes it at session finish. Nothing in this suite uses `assert_test`, so the plugin
# has no job here; leaving it on would mean the whole test run depends on DeepEval's
# own "skip if empty" logic to stay off the network. The LLM-judged eval arm imports
# deepeval directly (`evals/deepeval_arm.py`), which is unaffected by this.
addopts = "-q --strict-markers -p no:deepeval"
markers = [
    "db: needs a live Postgres; skipped when unreachable, always run in CI",
]
asyncio_mode = "auto"
