name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python — lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy backend tests

      # No external network calls: every provider is faked in tests.
      - name: Pytest
        run: uv run pytest

  web:
    name: Web — types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # No version pin here on purpose: the action reads `packageManager`
      # from frontend/package.json, so CI, the Docker build and the host all
      # use the same pnpm and therefore the same supply-chain policy.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  images:
    name: Docker — build both images
    runs-on: ubuntu-latest
    # The container path is proven on every change even though local
    # development does not use it.
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f backend/Dockerfile -t sma-api:ci .

      - name: Build web image
        run: docker build -f frontend/Dockerfile -t sma-web:ci frontend
