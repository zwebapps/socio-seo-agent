name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python — lint, types, tests
    runs-on: ubuntu-latest

    # The db-marked tests skip when Postgres is unreachable, which is right for a
    # developer laptop and wrong for CI: a silently-skipped tenant-isolation test
    # is indistinguishable from a passing one.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sma
          POSTGRES_PASSWORD: sma
          POSTGRES_DB: sma
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U sma -d sma"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      ENVIRONMENT: ci
      DATABASE_URL: postgresql+asyncpg://sma:sma@localhost:5435/sma
      APP_DATABASE_URL: postgresql+asyncpg://sma_app:sma_app@localhost:5435/sma

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      # `create_app()` refuses to start outside `local` without a real
      # SESSION_SECRET (main.py::_assert_secure), and it is constructed at test
      # COLLECTION time -- so without this every test in the suite errored before it
      # ran, and this job was green only because ruff and mypy pass on code nobody
      # executed. Generated per run rather than stored as a repository secret: it
      # signs nothing that outlives the job, there is no production value to leak,
      # and it means a fresh clone's CI needs no manual setup to be honest.
      - name: Generate an ephemeral session secret
        run: echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      # `backend` alone leaves `evals/` unchecked -- and the eval harness is the
      # thing that decides whether the product works, so it is the last place to
      # accept untyped code. `backend` already includes `backend/tests`.
      - name: Mypy (strict)
        run: uv run mypy backend evals

      # Creates the schema, the RLS policies, and the restricted sma_app role.
      - name: Migrate
        run: uv run alembic upgrade head

      # No external network calls: every provider is faked in tests.
      - name: Pytest
        run: uv run pytest

      # A skipped db test in CI would hide the isolation proof, so fail if any
      # test was skipped rather than run.
      - name: Assert the database tests actually ran
        run: uv run pytest backend/tests/db -q --no-header -p no:randomly | tee /tmp/db.txt && ! grep -q "skipped" /tmp/db.txt

  web:
    name: Web — types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # No version pin here on purpose: the action reads `packageManager`
      # from frontend/package.json, so CI, the Docker build and the host all
      # use the same pnpm and therefore the same supply-chain policy.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

      # Vitest + React Testing Library, in jsdom. Every request is faked at `fetch`, so
      # like the Python suite this makes no network call. Run as its own step rather than
      # chained onto typecheck, for the reason in CLAUDE.md: `a && b` skips `b` silently.
      - run: pnpm test

      - run: pnpm build

  images:
    name: Docker — build both images
    runs-on: ubuntu-latest
    # The container path is proven on every change even though local
    # development does not use it.
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f backend/Dockerfile -t sma-api:ci .

      - name: Build web image
        run: docker build -f frontend/Dockerfile -t sma-web:ci frontend
