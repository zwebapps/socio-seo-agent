# Compose owns stateful infrastructure only. The API and the web app run
# locally with hot reload (see the Makefile) -- rebuilding an image to see a
# code change is a poor development loop. The Dockerfiles still exist and are
# built in CI, so the container path stays proven without being on the critical
# path of day-to-day work.
#
# Syntax is kept conservative on purpose: this machine runs Docker 20.10 /
# Compose 2.10, so no `develop:`/`watch:` and no `include:`.
#
# Ports are non-default so this project cannot collide with a Postgres or Redis
# another project is already running.

version: "3.8"

services:
  postgres:
    # pgvector is needed from Phase 3 (the knowledge base). Using the pgvector
    # image now avoids a migration from plain postgres later.
    image: pgvector/pgvector:pg16
    container_name: sma-postgres
    environment:
      POSTGRES_USER: sma
      POSTGRES_PASSWORD: sma
      POSTGRES_DB: sma
    ports:
      - "5435:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sma -d sma"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sma-redis
    # Persistence on: Phase 2 uses Redis for the job queue and for provider
    # rate-limit token buckets shared across workers. Losing the queue on a
    # restart would mean losing enqueued runs.
    command: redis-server --appendonly yes
    ports:
      - "6381:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Object storage for uploaded documents and generated exports. Behind a
  # profile because nothing needs it until Phase 3:
  #   docker compose --profile storage up -d minio
  minio:
    image: minio/minio:latest
    container_name: sma-minio
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sma
      MINIO_ROOT_PASSWORD: sma-local-dev
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
